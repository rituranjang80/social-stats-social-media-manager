.custom_tooltip {
  position: relative;
  cursor: pointer;
}
.custom_tooltip:hover .tool_tip_box {
  opacity: 1;
  visibility: visible;
}
.custom_tooltip .tool_tip_box {
  position: absolute;
  z-index: 999;
  width: 180px;
  opacity: 0;
  visibility: hidden;
  -webkit-border-radius: 5px;
  -moz-border-radius: 5px;
  border-radius: 5px;
  -moz-background-clip: padding;
  -webkit-background-clip: padding-box;
  background-clip: padding-box;
  -webkit-box-shadow: 0 0 15px 0 rgba(184, 189, 209, 0.67);
  -moz-box-shadow: 0 0 15px 0 rgba(184, 189, 209, 0.67);
  box-shadow: 0 0 15px 0 rgba(184, 189, 209, 0.67);
  background-color: #ffffff;
  border: 1px solid rgba(152, 158, 181, 0.13);
}
.custom_tooltip .tool_tip_box .tool_tip_inner {
  padding: 10px;
  position: relative;
  text-align: center;
}
.custom_tooltip .tool_tip_box .tool_tip_inner:after,
.custom_tooltip .tool_tip_box .tool_tip_inner:before {
  position: absolute;
  content: '';
  width: 0;
  height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-top: 8px solid #ffffff;
}
.custom_tooltip .tool_tip_box .tool_tip_inner:before {
  border-top: 8px solid #3a4557;
}
.custom_tooltip .tool_tip_box.top_center {
  bottom: 118%;
  transform: translateX(-50%);
  left: 50%;
  right: 0;
}
.custom_tooltip .tool_tip_box.top_center .tool_tip_inner:after,
.custom_tooltip .tool_tip_box.top_center .tool_tip_inner:before {
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
}
.custom_tooltip .tool_tip_box.bottom_center {
  top: 118%;
  transform: translateX(-50%);
  left: 50%;
  right: 0;
}
.custom_tooltip .tool_tip_box.bottom_center .tool_tip_inner:after,
.custom_tooltip .tool_tip_box.bottom_center .tool_tip_inner:before {
  bottom: 100%;
  left: calc(50% - 18px);
  transform: rotate(-180deg) translateX(-50%);
}
.custom_tooltip .tool_tip_box.top_right {
  bottom: 118%;
  left: 15px;
}
.custom_tooltip .tool_tip_box.top_right .tool_tip_inner:after,
.custom_tooltip .tool_tip_box.top_right .tool_tip_inner:before {
  top: 100%;
  left: 20px;
}
.custom_tooltip .tool_tip_box.top_left {
  bottom: 118%;
  right: 15px;
}
.custom_tooltip .tool_tip_box.top_left .tool_tip_inner:after,
.custom_tooltip .tool_tip_box.top_left .tool_tip_inner:before {
  top: 100%;
  right: 20px;
}
.custom_tooltip .tool_tip_box.left_middle {
  top: 50%;
  right: 100%;
  transform: translateY(-50%);
}
.custom_tooltip .tool_tip_box.left_middle .tool_tip_inner:after,
.custom_tooltip .tool_tip_box.left_middle .tool_tip_inner:before {
  top: 50%;
  left: 97%;
  transform: rotate(-90deg);
}

.v-spinner .v-beat {
  -webkit-animation: v-beatStretchDelay 0.7s infinite linear;
  animation: v-beatStretchDelay 0.7s infinite linear;
  -webkit-animation-fill-mode: both;
  animation-fill-mode: both;
  display: inline-block;
}
.v-spinner .v-beat-odd {
  animation-delay: 0s;
}
.v-spinner .v-beat-even {
  animation-delay: 0.35s;
}
@-webkit-keyframes v-beatStretchDelay {
50% {
    -webkit-transform: scale(0.75);
    transform: scale(0.75);
    -webkit-opacity: 0.2;
    opacity: 0.2;
}
100% {
    -webkit-transform: scale(1);
    transform: scale(1);
    -webkit-opacity: 1;
    opacity: 1;
}
}
@keyframes v-beatStretchDelay {
50% {
    -webkit-transform: scale(0.75);
    transform: scale(0.75);
    -webkit-opacity: 0.2;
    opacity: 0.2;
}
100% {
    -webkit-transform: scale(1);
    transform: scale(1);
    -webkit-opacity: 1;
    opacity: 1;
}
}

  animation: v-clipDelay 0.75s 0s infinite linear;
  -webkit-animation-fill-mode: both;
  animation-fill-mode: both;
  display: block;
  margin: 0 auto;

@-webkit-keyframes v-clipDelay {
0% {
    -webkit-transform: rotate(0deg) scale(1);
    transform: rotate(0deg) scale(1);
}
50% {
    -webkit-transform: rotate(180deg) scale(0.8);
    transform: rotate(180deg) scale(0.8);
}
100% {
    -webkit-transform: rotate(360deg) scale(1);
    transform: rotate(360deg) scale(1);
}
}
@keyframes v-clipDelay {
0% {
    -webkit-transform: rotate(0deg) scale(1);
    transform: rotate(0deg) scale(1);
}
50% {
    -webkit-transform: rotate(180deg) scale(0.8);
