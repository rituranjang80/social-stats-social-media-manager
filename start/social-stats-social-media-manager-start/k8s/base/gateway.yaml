apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: social-stats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: social-stats-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: social-stats-config
          env:
            - name: BACKEND_UPSTREAM
              value: "backend:8000"
            - name: FRONTEND_UPSTREAM
              value: "frontend:3000"
          volumeMounts:
            - name: frontend-source
              mountPath: /var/www/frontend
              readOnly: true
            - name: runtime-data
              mountPath: /var/www/media
              subPath: media
              readOnly: true
            - name: runtime-data
              mountPath: /var/www/staticfiles
              subPath: staticfiles
              readOnly: true
            - name: nginx-templates
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: nginx-entrypoint
              mountPath: /docker-entrypoint.d/40-social-stats-gateway.sh
              subPath: entrypoint-gateway.sh
              readOnly: true
      volumes:
        - name: frontend-source
          hostPath:
            path: REPLACE_SOURCE_FRONTEND
            type: Directory
        - name: runtime-data
          hostPath:
            path: REPLACE_DATA_DIR
            type: DirectoryOrCreate
        - name: nginx-templates
          hostPath:
            path: REPLACE_START_NGINX_TEMPLATES
            type: Directory
        - name: nginx-entrypoint
          hostPath:
            path: REPLACE_START_NGINX
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: social-stats
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
